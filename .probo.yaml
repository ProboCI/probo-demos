# Setup the environment.
# This is where you configure your build envionment. For Drupal, we're using a PHP 8.4
# environment with the latest MySQL 8.0 database. Other database options are provided
# such as mariadb, postgresql, and mysql 5.7, 8.0 and 8.4. PHP versions are available
# from PHP 5.6 - PHP 8.5. Make sure you select the version of PHP most appropriate for
# the version of Drupal you are using. You can also use other versions for the purposes
# of testing in other versions.=
type: lamp
php: 8.4
database: mariadb:11.4
nodejs: 8

steps:
  # We need to tell Probo.CI that we're using a Drupal site so the database is properly configured
  # and settings.php files are also properly configured.
  - name: Set Up The Drupal Plugin
    plugin: Drupal
    drupalVersion: 11
    composer: true
    clearCaches: false
    databaseUpdates: false
    subDirectory: web
    phpIniOptions:
      memory_limit: 512M
      max_execution_time: 300

  # This will install a demonstration Drupal site with a standard username and password. Note that the
  # database username and password does not need to be changed and is a non-privileged user. The password
  # assigned can be configured and is not really a secret given it is insulated by using Docker contaienrs
  # to run as opposed to being accesible outside the application.
  - name: Run Drupal Installation using drush
    plugin: Script
    script: |
      cd $SRC_DIR/web/sites/default
      rm settings.php
      cp default.settings.php settings.php
      chmod 777 settings.php
      chmod -R 777 files
      drush site-install -y --account-name=admin --account-pass=admin --db-url=mysql://probo:strongpassword@localhost:3306/drupal --site-name="Modern Drupal Probo.CI Example" --site-mail="admin@example.com" --yes
      drush en admin_toolbar devel -y    
      drush cr

  - name: Build Our SASS Theme
    plugin: Script
    script: |
      cd $SRC_DIR/nel
      npm install
      npm run build

  # This step is optional given we are assigning our username and password in the previous step, but you can
  # leverage this technique to quickly log in to your Probo.CI environment with your privileged account.
  - name: Get Drush uli For Our site
    plugin: Script
    script: |
      cd $SRC_DIR/web
      drush uli

